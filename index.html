<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` bashkë me `env(safe-area-inset-*)` te CSS-i, që
         faqja e instaluar në iPhone të mos hyjë nën qoshet e rrumbullakuara. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Ngjyrat e parazgjedhjes, e jo të sistemit: temën e zgjedh aplikacioni
         (`tema.ts`), dhe `ndricimi.ts` e ndërron këtë meta sapo ta dijë cilën
         mban ky telefon. Me `media="(prefers-color-scheme: …)"` shiriti do të
         ndiqte telefonin e jo zgjedhjen — pra do të dilte i errët mbi një faqe
         të bardhë te aplikacioni i instaluar. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#047857" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23047857'/%3E%3Cg fill='white'%3E%3Crect x='7' y='8' width='9' height='14' rx='2' transform='rotate(-12 11.5 15)'/%3E%3Crect x='15' y='10' width='9' height='14' rx='2' transform='rotate(9 19.5 17)'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!-- Fonti rri brenda paketës; parangarkimi e shkurton pritjen me shkronjat
         e sistemit. Vetëm nënbashkësia `latin` — ajo mban shqipen. -->
    <link
      rel="preload"
      href="/shkronja/quicksand-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS-i nuk e lexon ikonën e manifestit dhe as SVG-në: i duhet një PNG e
         vetën, dhe mbi të vë vetë maskën me qoshe të rrumbullakuara — prandaj
         kjo është e njëjta ikonë me qoshet katrore. Të dyja PNG-të nxirren nga
         `public/ikona.svg`, që vizatimi të mbetet një. -->
    <link rel="apple-touch-icon" href="/ikona-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tavolina" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Tavolina" />

    <title>Tavolina — pikët e mbrëmjes</title>
    <meta
      name="description"
      content="Numërues pikësh për lojërat e tavolinës — bridzh, magarec, domina, pishpirik: raundet, totalet, renditja dhe shlyerja. Punon pa internet, të dhënat rrinë në telefon."
    />
    <!-- Aplikacion personal me të dhëna vetëm lokale: s'ka çka të indeksohet. -->
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
